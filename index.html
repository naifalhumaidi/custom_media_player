<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Tools</title>
<link rel="stylesheet" href="vendor/vidstack-base.css">
<link rel="stylesheet" href="styles-vidstack.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- icon sprite: every control uses one of these, no text labels -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="i-prev"><path d="M18.5 5 8.5 12l10 7z" fill="currentColor"/><rect x="5" y="5" width="2.4" height="14" fill="currentColor"/></g>
      <g id="i-next"><path d="M5.5 5l10 7-10 7z" fill="currentColor"/><rect x="16.6" y="5" width="2.4" height="14" fill="currentColor"/></g>
      <g id="i-back"><path d="M4 12a8 8 0 1 0 2.6-5.9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M4 4v5h5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="13" y="15.5" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">10</text></g>
      <g id="i-fwd"><path d="M20 12a8 8 0 1 1-2.6-5.9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="11" y="15.5" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">10</text></g>
      <g id="i-play"><path d="M7 4.6 19.2 12 7 19.4z" fill="currentColor"/></g>
      <g id="i-pause"><rect x="6.6" y="4.8" width="3.6" height="14.4" fill="currentColor"/><rect x="13.8" y="4.8" width="3.6" height="14.4" fill="currentColor"/></g>
      <g id="i-loop"><path d="M4 9.5h11.5a4 4 0 0 1 4 4v1.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="m7.4 6.2-3.4 3.3 3.4 3.3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 14.5H8.5a4 4 0 0 1-4-4V9.3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="m16.6 17.8 3.4-3.3-3.4-3.3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="i-auto"><path d="M4.5 3.5 20 12 4.5 20.5z" fill="currentColor"/></g>
      <g id="i-auto-off"><path d="M4.5 3.5 20 12 4.5 20.5z" fill="currentColor"/><path d="M2.5 2.5 21.5 21.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
      <g id="i-sound"><path d="M4 9.5h3l4.2-3.4v11.8L7 14.5H4z" fill="currentColor"/><path d="M14.4 9.2a4 4 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>
      <g id="i-mute"><path d="M4 9.5h3l4.2-3.4v11.8L7 14.5H4z" fill="currentColor"/><path d="M14.5 9.5 20 15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M20 9.5 14.5 15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></g>
      <g id="i-fit"><rect x="3" y="5" width="18" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 15.5 10 12l2.4 2.4L15 11.5l2.5 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="i-crop"><path d="M6.5 2.5v15h15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 6.5h15v15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="i-stretch"><rect x="6" y="5" width="12" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 12H6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M4.6 9.8 3 12l1.6 2.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.5 12H18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M19.4 9.8 21 12l-1.6 2.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="i-fs"><path d="M4 9.5V4h5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9.5V4h-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 14.5V20h5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 14.5V20h-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="i-fs-exit"><path d="M9.5 4v5.5H4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5 4v5.5H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 20v-5.5H4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5 20v-5.5H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="i-close"><path d="M6 6 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
      <g id="i-help"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.1" fill="currentColor"/></g>
      <g id="i-settings"><circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.1 14.2a1.5 1.5 0 0 0 .3 1.65l.06.06a1.8 1.8 0 1 1-2.55 2.55l-.06-.06a1.5 1.5 0 0 0-1.65-.3 1.5 1.5 0 0 0-.9 1.37v.17a1.8 1.8 0 1 1-3.6 0v-.09a1.5 1.5 0 0 0-.98-1.37 1.5 1.5 0 0 0-1.65.3l-.06.06A1.8 1.8 0 1 1 4.96 16.1l.06-.06a1.5 1.5 0 0 0 .3-1.65 1.5 1.5 0 0 0-1.37-.9h-.17a1.8 1.8 0 1 1 0-3.6h.09a1.5 1.5 0 0 0 1.37-.98 1.5 1.5 0 0 0-.3-1.65l-.06-.06A1.8 1.8 0 1 1 7.43 4.75l.06.06a1.5 1.5 0 0 0 1.65.3h.07a1.5 1.5 0 0 0 .9-1.37v-.17a1.8 1.8 0 1 1 3.6 0v.09a1.5 1.5 0 0 0 .9 1.37 1.5 1.5 0 0 0 1.65-.3l.06-.06a1.8 1.8 0 1 1 2.55 2.55l-.06.06a1.5 1.5 0 0 0-.3 1.65v.07a1.5 1.5 0 0 0 1.37.9h.17a1.8 1.8 0 1 1 0 3.6h-.09a1.5 1.5 0 0 0-1.37.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></g>
      <!-- Panel actions. i-folder and i-trash were referenced by the buttons
           but never drawn, so "add a folder" and "clear" rendered as empty
           squares. -->
      <!-- Add files and add a folder.

           Reported as "you have different icons for the same add files icon on
           the control bar and on the panel, why?" - there were three marks for
           two actions: a folder with a plus, a plain folder, and a folder with a
           plus that had a second sheet behind it.

           Two marks now, one per action, and both are the familiar shape rather
           than a folder that happens to have a plus somewhere: a sheet of paper
           with a folded corner for files, and a folder for folders. The plus is
           kept, on both, because it is what says "this adds" rather than "this
           is a file" - but it sits in the same place on both so the pair reads
           as one set at a glance.

           Same size, same stroke weight, same corner radius. The difference is
           the silhouette, which is the only difference a person needs. -->
      <g id="i-files">
        <path d="M6 3.5h7.2L18.5 8.7V20a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 20V5A1.5 1.5 0 0 1 6 3.5z"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M13.2 3.5v4.2a1 1 0 0 0 1 1h4.3"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M11.5 12.4v5.2M8.9 15h5.2"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <g id="i-folder">
        <path d="M3.5 6.8A1.5 1.5 0 0 1 5 5.3h4.1l1.8 2.1H19a1.5 1.5 0 0 1 1.5 1.5v8.6A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M12 11.2v5M9.5 13.7h5"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <g id="i-trash"><path d="M4.8 6.8h14.4M9.4 6.8V5.4a1.2 1.2 0 0 1 1.2-1.2h2.8a1.2 1.2 0 0 1 1.2 1.2v1.4M6.6 6.8l.9 11.9a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4l.9-11.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    </defs>
  </svg>

  <main id="stage" data-fit="contain" data-kind="">
    <media-player id="media" playsinline crossorigin>
      <media-provider></media-provider>
      <media-gesture event="pointerup" action="toggle:paused"></media-gesture>
      <media-captions></media-captions>

      <div id="bar" class="bar">
        <div class="bar-track">
          <media-time-slider class="vds-slider" aria-label="Seek" data-i18n-aria="bar.seek">
            <div class="vds-track"></div>
            <div class="vds-track-fill"></div>
            <div class="vds-track-progress"></div>
            <div class="vds-thumb"></div>
          </media-time-slider>
        </div>

        <div class="row">
          <div class="grp">
            <button id="prev" data-shortcut="previous" class="btn ic" type="button" title="Previous (,)" data-i18n-title="bar.previousKey" data-i18n-aria="bar.previous" aria-label="Previous"><svg viewBox="0 0 24 24"><use href="#i-prev"/></svg></button>
            <media-seek-button id="back" data-shortcut="seekBack" class="btn ic" seconds="-10" title="Back 10s (←)" data-i18n-title="bar.backKey" data-i18n-aria="bar.back" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></media-seek-button>
            <media-play-button id="play" data-shortcut="playPause" class="btn ic play" title="Play / pause (Space)" data-i18n-title="bar.playKey" data-i18n-aria="bar.play" aria-label="Play"><svg viewBox="0 0 24 24"><use href="#i-play"/><use href="#i-pause"/></svg></media-play-button>
            <media-seek-button id="fwd" data-shortcut="seekForward" class="btn ic" seconds="10" title="Forward 10s (→)" data-i18n-title="bar.forwardKey" data-i18n-aria="bar.forward" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><use href="#i-fwd"/></svg></media-seek-button>
            <button id="next" data-shortcut="next" class="btn ic" type="button" title="Next (.)" data-i18n-title="bar.nextKey" data-i18n-aria="bar.next" aria-label="Next"><svg viewBox="0 0 24 24"><use href="#i-next"/></svg></button>
          </div>

          <span class="time"><media-time id="time-now" type="current">0:00</media-time><i>/</i><media-time id="time-total" type="duration">0:00</media-time></span>

          <div class="meta">
            <span id="title" class="title"></span>
            <span id="counter" class="counter"></span>
          </div>

          <!-- Mute and volume are the app's own, not the library's.
               <media-mute-button> and <media-volume-slider> are bound to the
               player, and the player has no media to bind to once the playlist is
               empty: the button was on screen, took the click, and changed
               nothing. Reported as "I can't adjust the volume or mute it" after
               using the clear button.

               Neither is a property of a file. Both are how the listener wants
               to hear the next thing, so the app owns them, keeps them across a
               clear, and hands them to whatever loads next. A native range input
               rather than a hand-built one, so dragging, the arrow keys, Home,
               End and the screen reader all come with it. -->
          <div class="grp">
            <button id="mute" data-shortcut="mute" class="btn ic" type="button" title="Mute (m)" data-i18n-title="bar.muteKey" data-i18n-aria="bar.mute" aria-label="Mute" aria-pressed="false"><svg viewBox="0 0 24 24"><use href="#i-sound"/><use href="#i-mute"/></svg></button>
            <input id="volume" class="vds-slider vds-volume" type="range" min="0" max="1" step="0.01" value="1"
                   data-i18n-aria="bar.volume" aria-label="Volume">
            <button id="loop" data-shortcut="loop" class="btn ic" type="button" title="Loop playlist (l)" data-i18n-title="bar.loopKey" data-i18n-aria="bar.loop" aria-label="Loop"><svg viewBox="0 0 24 24"><use href="#i-loop"/></svg></button>
            <button id="autoplay" data-shortcut="autoplay" class="btn ic on" type="button" title="Auto-start on track change (a)" data-i18n-title="bar.autoplayKey" data-i18n-aria="bar.autoplay" aria-label="Auto-start"><svg viewBox="0 0 24 24"><use href="#i-auto"/><use href="#i-auto-off"/></svg></button>
            <button id="fit-d" data-shortcut="fitDefault" class="btn ic" type="button" title="Default / fit (d)" data-i18n-title="bar.fitDefaultKey" data-i18n-aria="bar.fitDefault" aria-label="Default view"><svg viewBox="0 0 24 24"><use href="#i-fit"/></svg></button>
            <button id="fit-c" data-shortcut="fitCrop" class="btn ic" type="button" title="Crop (c)" data-i18n-title="bar.fitCropKey" data-i18n-aria="bar.fitCrop" aria-label="Crop"><svg viewBox="0 0 24 24"><use href="#i-crop"/></svg></button>
            <button id="fit-s" data-shortcut="fitStretch" class="btn ic" type="button" title="Stretch (S)" data-i18n-title="bar.fitStretchKey" data-i18n-aria="bar.fitStretch" aria-label="Stretch"><svg viewBox="0 0 24 24"><use href="#i-stretch"/></svg></button>
            <button id="fs" data-shortcut="fullscreen" class="btn ic" type="button" title="Fullscreen (f)" data-i18n-title="bar.fullscreenKey" data-i18n-aria="bar.fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><use href="#i-fs"/><use href="#i-fs-exit"/></svg></button>
                      </div>
        </div>
      </div>
    </media-player>

    <img id="still" alt="" draggable="false">

    <aside id="side">
      <div class="side-head">
        <span class="side-title" data-i18n="panel.title">Playlist</span>
        <span id="total" class="total"></span>
        <button id="add" class="btn ic sm" type="button" title="Add files (O)" data-i18n-title="panel.addKey" data-i18n-aria="panel.add" aria-label="Add files"><svg viewBox="0 0 24 24"><use href="#i-files"/></svg></button>
        <button id="add-folder" class="btn ic sm" type="button" title="Add a folder (⇧O)" data-i18n-title="panel.addFolderKey" data-i18n-aria="panel.addFolderAria" aria-label="Add a folder" hidden><svg viewBox="0 0 24 24"><use href="#i-folder"/></svg></button>
        <!-- only offered by the desktop builds, and only when they can actually
             restore a playlist: a clear button in a tab that forgets everything
             on reload is a trap. js/app.js hides it otherwise. -->
        <button id="clear-list" class="btn ic sm" type="button" title="Clear the playlist (⇧X)" data-i18n-title="panel.clearKey" data-i18n-aria="panel.clearAria" aria-label="Clear the playlist" hidden><svg viewBox="0 0 24 24"><use href="#i-trash"/></svg></button>
        <button id="close-side" class="btn ic sm" type="button" title="Close the playlist (P)" data-i18n-title="panel.closeKey" data-i18n-aria="panel.closeAria" aria-label="Close playlist"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
      </div>
      <ol id="list" class="side-list"></ol>
      <!-- One message, and it names the two buttons rather than describing the
           drop twice in two voices. -->
      <div id="side-empty" class="side-empty" hidden>
        <p class="side-empty-title" data-i18n="panel.emptyTitle">Nothing here yet</p>
        <p class="side-empty-body">
          <button id="empty-add" class="btn txt" type="button" title="Add files (O)" data-i18n-title="panel.addKey" data-i18n="panel.emptyAdd">Add files</button>
          <button id="empty-add-folder" class="btn txt" type="button" title="Add a folder (⇧O)" data-i18n-title="panel.addFolderKey" data-i18n="panel.emptyAddFolder" hidden>Add a folder</button>
          <span class="side-empty-or" data-i18n="panel.emptyOr">or drop them anywhere on the window</span>
        </p>
      </div>
      <!-- Shown once the playlist has something in it. -->
      <p class="side-hint" data-i18n="panel.hint" hidden>drop here to add — playback keeps going</p>
    </aside>

    <div id="drop" class="drop">
      <!-- the small copy; assets/logo.png is the full-size original -->
      <img class="logo" src="assets/logo-small.png" width="1200" height="675" alt="Media Tools" data-i18n-alt="app.logoAlt">
    </div>

    <!-- a sibling of #drop, not a child: #drop is hidden as soon as the
         playlist is non-empty, which is exactly when these messages fire, so
         inside it they could never be seen -->
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
  </main>

  <div id="help-modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <header class="modal-head">
        <h2 id="help-title" data-i18n="help.title">About</h2>
        <button id="help-close" class="btn ic" type="button" title="Close (Esc)" data-i18n-title="help.close" data-i18n-aria="common.close" aria-label="Close"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
      </header>

      <!-- One column, scrolled. It was a grid of cards, which looked good and
           read badly: four things side by side, each one short enough that the
           eye jumped between them, and the eye has to choose where to start. A
           single column with a clear order - what this is, then settings, then
           files, then keys - is read top to bottom and scrolled like a page. -->
      <!-- Two paragraphs and nothing else.

           It was a page with four sections and three key tables. That is what a
           manual looks like, and a manual is not what someone opens when they
           want to know what this is. Two paragraphs: what the app does, and that
           the language, the logo and the brand colour are theirs to change, and
           where to find them.

           No button to Settings. Settings has its own place in the menu bar
           above, and a button that says "go to the thing in the menu bar" is a
           button about the menu bar.

           The shortcuts are not here either. They are in Settings, where they
           can be changed - a list you cannot edit is a list you have to trust. -->
      <div class="modal-body help-body">
        <section class="help-lead">
          <p class="help-tagline" data-i18n="app.about"></p>
        </section>
        <section>
          <p class="help-note" data-i18n="help.settingsAll"></p>
        </section>
      </div>
    </div>
  </div>

  <!-- Clearing the playlist.
       A confirmation, because the button is a trash can next to the add button
       and one mis-click throws away an ordering somebody may have spent an hour
       on. Two buttons and no third choice: Cancel is focused, so Enter cancels
       and a stray Return does the safe thing.

       Deliberately NOT window.confirm: it cannot be styled, cannot be
       translated, and on some platforms it renders as a sheet from another
       decade. This says what will happen, in the app's own words, in the app's
       own colours. -->
  <div id="clear-modal" class="modal" hidden>
    <div class="modal-card tiny" role="alertdialog" aria-modal="true" aria-labelledby="clear-title" aria-describedby="clear-body">
      <header class="modal-head">
        <h2 id="clear-title" data-i18n="clear.title">Clear the playlist?</h2>
      </header>
      <div class="modal-body single">
        <p id="clear-body" class="confirm-body" data-i18n="clear.body">Every file will be removed from the list. The files themselves are not deleted.</p>
        <!-- Cancel first in the source, so it is first in the tab order and
             first to hold the focus. Arrow keys move between them and Enter
             activates whichever is focused, which is what two real buttons in a
             real dialog already do - the keydown handler no longer swallows the
             keys its own children handle. -->
        <div class="confirm-row">
          <button id="clear-cancel" class="btn txt" type="button" data-i18n="clear.cancel">Cancel</button>
          <button id="clear-ok" class="btn txt danger" type="button" data-i18n="clear.ok">Clear it</button>
        </div>
      </div>
    </div>
  </div>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-card narrow" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="modal-head">
        <h2 id="settings-title" data-i18n="settings.title">Settings</h2>
        <button id="settings-close" class="btn ic" type="button" title="Close (Esc)" data-i18n-title="settings.close" data-i18n-aria="common.close" aria-label="Close"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
      </header>

      <div class="modal-body single">
        <section>
          <h3 data-i18n="settings.appearance">Appearance</h3>

          <div class="field">
            <label for="set-lang" data-i18n="settings.language">Language</label>
            <select id="set-lang">
              <option value="en" data-i18n="lang.en">English</option>
              <option value="ar" data-i18n="lang.ar">العربية</option>
            </select>
          </div>

          <div class="field">
            <label for="set-logo" data-i18n="settings.logo">Mark on the start window</label>
            <!-- The mark is always shown. Removing your own falls back to the
                 built-in wordmark rather than to nothing, so there is never a
                 blank start window and no "use the default" button to explain. -->
            <div class="logo-row">
              <img id="set-logo-preview" class="field-preview" alt="">
              <div class="field-row">
                <!-- A button, not a file input.
                     The input was on show as "No file chosen" beside a bare
                     Choose-file box, which describes the control rather than the
                     action: it asked the user to read the widget instead of
                     reading the app. The input is still here - it is how a file
                     is chosen - but it is off screen, and the button is what is
                     in front of them. A label, not a script: the browser's own
                     file dialog, focus behaviour and keyboard handling all still
                     work, because this is still a real label for a real input. -->
                <label class="btn txt" for="set-logo" data-i18n="settings.logoChange">Change logo</label>
                <input id="set-logo" class="offscreen-input" type="file" accept="image/*" data-i18n-aria="settings.logo" tabindex="-1">
                <button id="set-logo-clear" class="btn txt" type="button" title="Remove your mark" data-i18n-title="settings.logoClearTitle" data-i18n="settings.logoClear">Remove</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="set-color" data-i18n="settings.color">Brand colour</label>
            <div class="field-row">
              <input id="set-color" type="color" value="#aa7827">
              <button id="set-color-reset" class="btn txt" type="button" title="Take the colour from your mark" data-i18n-title="settings.colorResetTitle" data-i18n="settings.colorReset">Use logo color</button>
            </div>
          </div>
        </section>

        <section>
          <h3 data-i18n="settings.shortcuts">Shortcuts</h3>
          <p class="help-lead-text" data-i18n="settings.shortcutsLead"></p>

          <table class="shortcuts" id="shortcut-table">
            <tbody id="shortcut-rows"></tbody>
          </table>

          <div class="field-row">
            <button id="shortcut-reset" class="btn txt" type="button" data-i18n="settings.shortcutsReset">Reset to defaults</button>
            <span id="shortcut-hint" class="field-hint" data-i18n="settings.shortcutsHint"></span>
          </div>
        </section>

        <p id="set-save-error" class="field-error" role="alert" hidden data-i18n="settings.saveFailed"></p>
      </div>
    </div>
  </div>

  <script src="vendor/vidstack.js"></script>
  <script src="js/mime.js"></script>
  <script src="js/source-web.js"></script>
  <script src="js/source-tauri.js"></script>
  <script src="js/source-electron.js"></script>
  <script src="js/source.js"></script>
  <script src="js/media.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menubar.js"></script>
  <!-- js/menubar.js before js/app.js because app.js mounts it, the same way
       js/i18n.js comes first: nothing bundles, so order in this list is the
       only ordering there is. -->
  <script src="js/settings.js"></script>
  <!-- js/app.js, like every other script here: the compiler writes into js/, and the
       page asked for app.js at the root - a path that only a stale hand-written
       file from before the port ever occupied. -->
  <script src="js/app.js"></script>
</body>
</html>
