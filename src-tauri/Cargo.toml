[package]
name = "custom-media-player"
version = "1.0.0"
description = "A local media player for images, video and audio"
authors = ["Almenber Tools"]
edition = "2021"
rust-version = "1.77.2"

# A single binary. The lib/bin split exists so mobile targets can link the
# library; this is desktop-only, so it would be indirection for nothing.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
