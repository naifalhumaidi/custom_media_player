# One-shot Windows build.
#
# Why this exists: a Windows installer cannot be produced on Linux without the
# MSVC toolchain, and even with cargo-xwin the MSVC CRT download is large enough
# to stall on a slow connection. A Windows runner has the whole toolchain already
# present, so this produces the same artefact in a few minutes and with no
# local setup.
#
# It is deliberately NOT a CI pipeline: it runs only when you ask for it, from
# the Actions tab. Push a tag of the form v* and it will build.
#
# The result is an .exe, not an installer. An installer would need code signing
# to avoid a SmartScreen warning, and that costs money; a portable .exe that
# runs after one "Run anyway" click is the honest thing to ship while unsigned.

name: build windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: install dependencies
        run: npm install

      - name: build
        run: npm run desktop:build

      # The whole point: a portable exe the user can copy to a laptop.
      - uses: actions/upload-artifact@v4
        with:
          name: custom-media-player-windows
          path: src-tauri/target/release/*.exe
          if-no-files-found: error

      # An .msi as well, for anyone who wants a proper install.
      - uses: actions/upload-artifact@v4
        with:
          name: custom-media-player-windows-installer
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore
